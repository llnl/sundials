AMD-MI300A:
  extends: [.common-setup, .test-artifacts]
  tags: [uo-gpu, odyssey, amd-mi300, x86_64-amdgpu]
  image: rocm/dev-ubuntu-26.04:7.14.0-full
  timeout: 2h
  script:
    - apt-get update && apt-get install -y build-essential cmake git python3
    - export HSA_XNACK=1
    - export HIP_VISIBLE_DEVICES=3
    - export LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:${LD_LIBRARY_PATH}
    - export CXX=$(command -v hipcc)
    - export SUNDIALS_HIP=ON
    - cd ${CI_PROJECT_DIR}/test
    - >-
      ./test_driver.sh --testtype CUSTOM --env env/uoregon.sh --tpls ON
      --sunrealtype double --indexsize 64 --suntesttype STD --phase TEST --buildjobs 8
      --testjobs 1
