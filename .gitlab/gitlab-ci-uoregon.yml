###############################################################################
# VARIABLES
###############################################################################

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3

###############################################################################
# MAIN PIPELINE STAGES
###############################################################################

stages:
  - build-and-test

###############################################################################
# JOBS
###############################################################################

.common-setup:
  stage: build-and-test
  rules:
    # Direct pushes to the mirrored develop branch.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      when: always
    # Temporary exception while validating the GitHub status bridge.
    # Remove this rule after the bridge is merged and validated.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feature/uoregon-gitlab-ci"'
      when: always
    # GitHub PRs mirrored as branches named pr<number>_<branch>.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^pr[0-9]+(_.*)?$/'
      when: always
    # Native GitLab or externally integrated GitHub PR pipelines targeting develop.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event" && $CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: always
    - when: never
  variables:
    OMP_NUM_THREADS: "8"
    OMP_PLACES: "cores"
    OMP_PROC_BIND: "close"
  before_script:
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "schedule" ]; then
        export BUILD_TYPE=Debug
      elif [ "${CI_COMMIT_REF_NAME}" = "develop" ]; then
        export BUILD_TYPE=Release
      else
        export BUILD_TYPE=RelWithDebInfo
      fi

.test-artifacts:
  artifacts:
    when: on_failure
    paths:
      - test/build_*/

NVIDIA-RTX5080:
  extends: [.common-setup, .test-artifacts]
  tags: [uo-gpu, nvidia-rtx5080, x86_64-nvidiagpu]
  image: nvcr.io/nvidia/cuda:13.3.0-devel-ubuntu26.04
  timeout: 2h
  script:
    - apt-get update && apt-get install -y build-essential cmake git python3
    - export SUNDIALS_CUDA=ON
    - export CUDACXX=$(command -v nvcc)
    - cd ${CI_PROJECT_DIR}/test
    - >-
      ./test_driver.sh --testtype CUSTOM --env env/uoregon.sh --tpls ON
      --sunrealtype double --indexsize 64 --suntesttype STD --phase TEST --buildjobs 4
      --testjobs 1

