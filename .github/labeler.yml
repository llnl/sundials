# Labels for changes to the repository infrastructure.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.gitlab/build_and_bench.sh'
          - '.gitlab/build_and_test.sh'
          - 'docker/sundials-ci/**'
          - 'test/test_driver.sh'

ci-github:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'

ci-jenkins:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/env/jenkins.sh'
          - 'test/jenkins/**'

ci-lc-gitlab:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/hubcast.yml'
          - '.gitlab/custom-jobs-and-variables.yml'
          - '.gitlab/gitlab-ci-llnl-lc.yml'
          - '.gitlab/jobs/**'
          - '.gitlab/subscribed-pipelines.yml'

ci-uoregon-gitlab:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/uoregon-gitlab-status.yml'
          - '.gitlab/gitlab-ci-uoregon.yml'
          - 'test/env/uoregon.sh'

