name: CI Containers - spack@develop

on:
  # Temporary for testing -- remove before PR
  push:
  # Allows manual triggering
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run the Ubuntu test suite against the new containers'
        type: boolean
        default: false
  # 22:30 PST / 23:30 PDT on the 1st and 15th (06:30 UTC on the 2nd and 16th)
  schedule:
  - cron: '30 6 2,16 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build_ci_containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        indexsize: [32, 64]
        precision: ['single', 'double', 'extended']
    steps:
    - name: VM Hardware Info
      run: cat /proc/cpuinfo

    - name: Checkout
      uses: actions/checkout@v7

    - name: Free up disk space
      uses: ./.github/actions/free-space-ubuntu

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7.3.0
      with:
        context: "./scripts/docker"
        build-args: |
          SPACK_BASE_IMAGE=spack/ubuntu-noble:develop
          UPDATE_SPACK_PACKAGES=true
          spack_yaml=int${{ matrix.indexsize }}-${{ matrix.precision }}/spack.yaml
        push: true
        tags: >-
          ${{ env.REGISTRY }}/llnl/sundials-ci-int${{ matrix.indexsize }}-${{ matrix.precision }}:spack-develop

  test_ci_containers:
    needs: build_ci_containers
    if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.run_tests
    uses: ./.github/workflows/ubuntu-latest.yml
    with:
      container_tag: spack-develop
