name: CI Containers - spack@release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  packages: write

env:
  SPACK_RELEASE: v1.1.1
  REGISTRY: ghcr.io

jobs:
  build_ci_containers:
    strategy:
      fail-fast: false
      matrix:
        indexsize: [32, 64]
        precision: ['single', 'double', 'extended']
    runs-on: ubuntu-latest
    steps:
    - name: VM Hardware Info
      run: cat /proc/cpuinfo

    - name: Checkout
      uses: actions/checkout@v6

    - name: Free up disk space
      uses: ./.github/actions/free-space-ubuntu

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7.1.0
      with:
        context: "./docker/sundials-ci"
        build-args: |
          SPACK_BASE_IMAGE=spack/ubuntu-noble:${{ env.SPACK_RELEASE }}
          spack_yaml=int${{ matrix.indexsize }}-${{ matrix.precision }}/spack.yaml
        push: true
        tags: >-
          ${{ env.REGISTRY }}/llnl/sundials-ci-int${{ matrix.indexsize }}-${{ matrix.precision }}:spack-${{ env.SPACK_RELEASE }}
        cache-from: type=gha,scope=sundials-ci-int${{ matrix.indexsize }}-${{ matrix.precision }}-release
        cache-to: type=gha,mode=max,scope=sundials-ci-int${{ matrix.indexsize }}-${{ matrix.precision }}-release
