name: Build and Test - Windows/intel/ninja (short)

on:
  # Allows this workflow to be called by other workflows
  workflow_call:
  # Allows manual triggering
  workflow_dispatch:

# Cancel any in-progress workflow runs
concurrency:
  group: windows-intel-ninja-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: intel
        version: '2025.0'

    - name: Install Ninja
      run: choco install ninja

    - uses: actions/checkout@v6

    - name: Configure CMake (Static)
      shell: cmd
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cmake -W error=dev -G "Ninja" -B "%GITHUB_WORKSPACE%\build_static" ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_C_FLAGS=-Wno-deprecated-declarations ^
          -DCMAKE_C_COMPILER=icx-cl ^
          -DCMAKE_CXX_COMPILER=icx-cl ^
          -DCMAKE_Fortran_COMPILER=ifx ^
          -DBUILD_STATIC_LIBS=ON

    - name: Build (Static)
      shell: cmd
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cmake --build "%GITHUB_WORKSPACE%\build_static" --verbose

    - name: Test (Static)
      shell: cmd
      working-directory: ${{ github.workspace }}/build_static
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        ctest -C %BUILD_TYPE% --output-on-failure

    - name: Configure CMake (Shared)
      shell: cmd
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cmake -W error=dev -G "Ninja" -B "%GITHUB_WORKSPACE%\build_shared" ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_C_FLAGS=-Wno-deprecated-declarations ^
          -DCMAKE_C_COMPILER=icx-cl ^
          -DCMAKE_CXX_COMPILER=icx-cl ^
          -DCMAKE_Fortran_COMPILER=ifx ^
          -DBUILD_SHARED_LIBS=ON

    - name: Build (Shared)
      shell: cmd
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cmake --build "%GITHUB_WORKSPACE%\build_shared" --verbose

    - name: Test (Shared)
      shell: cmd
      working-directory: ${{ github.workspace }}/build_shared
      run: |
        call "%ProgramFiles(x86)%\Intel\oneAPI\setvars.bat" intel64
        call "%ProgramFiles(x86)%\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        ctest -C %BUILD_TYPE% --output-on-failure