name: ci

# Workflow triggers
on:
  # Run on push for testing
  push:
  # Runs on PRs targeting main or develop branches
  pull_request:
    branches: [main, develop]
  # Runs when PRs enter the merge queue
  merge_group:
  # Allows manual triggering with option to skip change detection
  workflow_dispatch:
    inputs:
      skip-change-detection:
        description: 'Skip change detection and run all jobs'
        required: false
        type: boolean
        default: false

# Cancel any in-progress workflow runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      src: ${{ steps.changes.outputs.src }}
      python: ${{ steps.changes.outputs.python }}
      fortran: ${{ steps.changes.outputs.fortran }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # If manually triggered with skip flag, run everything
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.skip-change-detection }}" == "true" ]; then
            echo "docs=true" >> $GITHUB_OUTPUT
            echo "src=true" >> $GITHUB_OUTPUT
            echo "python=true" >> $GITHUB_OUTPUT
            echo "fortran=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If release PR, run everything
          BRANCH_NAME=""
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi

          if [[ "$BRANCH_NAME" == release/* ]]; then
            echo "Release branch detected ($BRANCH_NAME), running all jobs"
            echo "docs=true" >> $GITHUB_OUTPUT
            echo "src=true" >> $GITHUB_OUTPUT
            echo "python=true" >> $GITHUB_OUTPUT
            echo "fortran=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine the base and head commits for git diff
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          elif [ "${{ github.event_name }}" == "merge_group" ]; then
            BASE=${{ github.event.merge_group.base_sha }}
            HEAD=${{ github.event.merge_group.head_sha }}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          # Check for changes to trigger documentation build checks
          # Updates in doc, bindings/sundials4py, or tools directories
          if git diff --name-only $BASE $HEAD | grep -qE '^(doc/|bindings/sundials4py/|tools/)'; then
            echo "docs=true" >> $GITHUB_OUTPUT
          else
            echo "docs=false" >> $GITHUB_OUTPUT
          fi

          # Check for changes to trigger build and test jobs
          # Updates to CMakeLists.txt or src, cmake, examples, benchmarks, or test directories
          if git diff --name-only $BASE $HEAD | grep -qE '^(src/|CMakeLists\.txt$|cmake/|examples/|benchmarks/|test/)'; then
            echo "src=true" >> $GITHUB_OUTPUT
          else
            echo "src=false" >> $GITHUB_OUTPUT
          fi

          # Check for changes to trigger python interface checks
          # Updates in include or bindings/sundials4py directories
          if git diff --name-only $BASE $HEAD | grep -qE '^(include/|bindings/sundials4py/)'; then
            echo "python=true" >> $GITHUB_OUTPUT
          else
            echo "python=false" >> $GITHUB_OUTPUT
          fi

          # Check for changes to trigger Fortran interface checks
          # Updates in include or swig directories
          if git diff --name-only $BASE $HEAD | grep -qE '^(include/|swig/)'; then
            echo "fortran=true" >> $GITHUB_OUTPUT
          else
            echo "fortran=false" >> $GITHUB_OUTPUT
          fi

  check-format:
    needs: detect-changes
    uses: ./.github/workflows/check-format.yml

  check-fortran:
    needs: [detect-changes, check-format]
    if: |
      always() &&
      needs.detect-changes.outputs.fortran == 'true' &&
      needs.check-format.result == 'success'
    uses: ./.github/workflows/check-swig.yml

  # check-python:
  #   needs: [detect-changes, check-format]
  #   if: |
  #     always() &&
  #     needs.detect-changes.outputs.python == 'true' &&
  #     needs.check-format.result == 'success'
  #   uses: ./.github/workflows/check-litgen.yml

  build-docs:
    needs: [detect-changes, check-format, check-fortran]
    if: |
      always() &&
      needs.detect-changes.outputs.docs == 'true' &&
      needs.check-format.result == 'success' &&
      (needs.check-fortran.result == 'success' || needs.check-fortran.result == 'skipped')
    uses: ./.github/workflows/docs-pdfs.yml

  build-and-test:
    needs: [detect-changes, check-format, check-fortran, build-docs]
    if: |
      always() &&
      needs.detect-changes.outputs.src == 'true' &&
      needs.check-format.result == 'success' &&
      (needs.check-fortran.result == 'success' || needs.check-fortran.result == 'skipped') &&
      (needs.build-docs.result == 'success' || needs.build-docs.result == 'skipped')
    uses: ./.github/workflows/build-and-test.yml

  # Status aggregation jobs for branch protection
  format-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, check-format]
    if: always()
    steps:
      - name: Check format status
        run: |
          RESULT="${{ needs.check-format.result }}"
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "Format check failed or was cancelled (result: $RESULT)"
            exit 1
          fi
          echo "Format check passed (result: $RESULT)"

  fortran-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, check-fortran]
    if: always()
    steps:
      - name: Check Fortran interface regeneration status
        run: |
          RESULT="${{ needs.check-fortran.result }}"
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "Fortran interface regeneration failed or was cancelled (result: $RESULT)"
            exit 1
          fi
          echo "Fortran interface regeneration check passed (result: $RESULT)"

  # python-status:
  #   runs-on: ubuntu-latest
  #   needs: [detect-changes, check-python]
  #   if: always()
  #   steps:
  #     - name: Check Python interface regeneration status
  #       run: |
  #         RESULT="${{ needs.check-python.result }}"
  #         if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
  #           echo "Python interface regeneration failed or was cancelled (result: $RESULT)"
  #           exit 1
  #         fi
  #         echo "Python interface regeneration check passed (result: $RESULT)"

  docs-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-docs]
    if: always()
    steps:
      - name: Check docs build status
        run: |
          RESULT="${{ needs.build-docs.result }}"
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "Documentation build failed or was cancelled (result: $RESULT)"
            exit 1
          fi
          echo "Documentation check passed (result: $RESULT)"

  build-and-test-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: always()
    steps:
      - name: Check build and test status
        run: |
          RESULT="${{ needs.build-and-test.result }}"
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "Build and test failed or was cancelled (result: $RESULT)"
            exit 1
          fi
          echo "Build and test check passed (result: $RESULT)"

  all-checks:
    runs-on: ubuntu-latest
    needs: [format-status, docs-status, fortran-status, build-and-test-status]
    if: always()
    steps:
      - name: Aggregate all checks
        run: |
          FORMAT_RESULT="${{ needs.format-status.result }}"
          FORTRAN_RESULT="${{ needs.fortran-status.result }}"
          # PYTHON_RESULT="${{ needs.python-status.result }}"
          DOCS_RESULT="${{ needs.docs-status.result }}"
          BUILD_AND_TEST_RESULT="${{ needs.build-and-test-status.result }}"

          if [ "$FORMAT_RESULT" != "success" ] || [ "$DOCS_RESULT" != "success" ] || [ "$FORTRAN_RESULT" != "success" ] || [ "$BUILD_AND_TESET_RESULT" != "success" ]; then
            echo "One or more checks failed"
            echo "  format-status: $FORMAT_RESULT"
            echo "  fortran-status: $FORTRAN_RESULT"
            # echo "  python-status: $PYTHON_RESULT"
            echo "  docs-status: $DOCS_RESULT"
            echo "  build-and-test-status: $BUILD_AND_TEST_RESULT"
            exit 1
          fi
          echo "All checks passed"
