[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sundials-suntools"
version = "7.6.0"
description = "Utilities for parsing SUNDIALS SUNLogger output (suntools)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "SUNDIALS Developers", email = "sundials-users@llnl.gov" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://computing.llnl.gov/projects/sundials"
Documentation = "https://sundials.readthedocs.io/"
Source = "https://github.com/LLNL/sundials"

[project.scripts]
suntools = "suntools.cli:main"

[tool.setuptools]
packages = ["suntools"]
