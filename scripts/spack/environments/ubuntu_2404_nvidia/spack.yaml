spack:
  concretizer:
    unify: true

  view: false

  packages:
    c:
      prefer:
      - nvhpc 
    cxx:
      prefer:
      - nvhpc
    fortran:
      prefer:
      - nvhpc  

    nvhpc:
      version: [26.3]
      externals:
        - spec: nvhpc@26.3
          prefix: /opt/nvidia/hpc_sdk/Linux_x86_64/26.3
      extra_attributes:
        compilers:
          c: /opt/nvidia/hpc_sdk/Linux_x86_64/26.3/compilers/bin/nvc
          cxx: /opt/nvidia/hpc_sdk/Linux_x86_64/26.3/compilers/bin/nvc++
          fortran: /opt/nvidia/hpc_sdk/Linux_x86_64/26.3/compilers/bin/nvfortran
