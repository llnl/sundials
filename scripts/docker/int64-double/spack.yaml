spack:
  packages:
    all:
      target: [x86_64]
      providers:
        blas:
        - openblas
        mpi:
        - openmpi
  specs:
  - cmake
  - ginkgo
  - hypre +int64 precision=double
  - kokkos +serial +openmp
  - kokkos-kernels +serial +openmp
  - openblas +ilp64
  - openmpi
  - petsc +double +int64 ~superlu-dist ~hypre
  - suite-sparse ^openblas +ilp64
  - superlu-dist +int64 ^parmetis+int64 ^metis+int64 ^netlib-lapack # needs 32-bit index blas
  - superlu-mt@master +int64 ~blas # TODO(DJG): update to 4.0.2
  - trilinos ~float +tpetra gotype=long_long
  - xbraid
  concretizer:
    compiler_mixing: false
    unify: when_possible # because superlu-dist needs 32-bit index blas
  config:
    install_tree:
      root: /opt/software
  mirrors:
    local: /var/cache/spack-mirror
    spack-public: https://binaries.spack.io/v1.1.1
  repos: []
  upstreams: {}
  view:
    default:
      root: /opt/view
      projections:
        superlu-mt: '{name}'
        superlu-dist: '{name}'
