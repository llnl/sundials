# Tune inexact-Newton forcing and Jacobian reuse for the robot-kinematics solve.
# eta_form/value trade linear-solve accuracy against nonlinear progress;
# max_setup_calls trades dense Jacobian setup cost against reuse. The line
# search, constraints, and dense solver remain fixed.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-kinsol-robokin-yaml-default-surrogate

executable:
  command: $builddir/examples/kinsol/serial/kinRoboKin_dns
  args: []
  cwd: .
  env: {}

parameters:
  - name: kinsol.eta_form
    type: int
    bounds: [1, 3]
  - name: kinsol.eta_const_value
    type: float
    bounds: [0.01, 0.5]
  - name: kinsol.max_setup_calls
    type: int
    bounds: [1, 20]

objective:
  metric: wall_time
  direction: minimize
