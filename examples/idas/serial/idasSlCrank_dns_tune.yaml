# Tune the IDAS slider-crank DAE's BDF and nonlinear/setup controls. Order
# trades accuracy against work; delta_cj controls setup reuse; the nonlinear
# coefficient balances convergence strictness against iterations. Quadrature,
# the dense solver, and tolerances remain fixed.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-idas-slcrank-yaml-default-surrogate

executable:
  command: $builddir/examples/idas/serial/idasSlCrank_dns
  args: []
  cwd: .
  env: {}

parameters:
  - name: idas.max_order
    type: int
    bounds: [2, 5]
  - name: idas.delta_cj_lsetup
    type: float
    bounds: [0.1, 0.5]
  - name: idas.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]

objective:
  metric: wall_time
  direction: minimize
