# Tune the IDAS food-web DAE's BDF and nonlinear/setup controls. Order trades
# accuracy against work; delta_cj controls setup reuse; the nonlinear
# coefficient trades solve tightness against iterations. The banded stack and
# consistent-IC procedure remain fixed.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-idas-foodweb-bnd-yaml-default-surrogate

executable:
  command: $builddir/examples/idas/serial/idasFoodWeb_bnd
  args: []
  cwd: .
  env: {}

parameters:
  - name: idas.max_order
    type: int
    bounds: [2, 5]
  - name: idas.delta_cj_lsetup
    type: float
    bounds: [0.1, 0.5]
  - name: idas.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]

objective:
  metric: wall_time
  direction: minimize
