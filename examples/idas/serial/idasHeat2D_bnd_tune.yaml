# Tune the IDAS heat DAE's BDF and nonlinear/setup controls. Order trades
# accuracy against work; delta_cj governs matrix setup reuse; the nonlinear
# coefficient balances solve tightness against iterations. The banded stack,
# constraints, tolerances, and consistent-IC procedure remain fixed.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-idas-heat2d-bnd-yaml

executable:
  command: $builddir/examples/idas/serial/idasHeat2D_bnd
  args: []
  cwd: .
  env: {}

parameters:
  - name: idas.max_order
    type: int
    bounds: [2, 5]
  - name: idas.delta_cj_lsetup
    type: float
    bounds: [0.1, 0.5]
  - name: idas.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]

objective:
  metric: wall_time
  direction: minimize
