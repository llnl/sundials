# Tune the fixed implicit heat-equation stack. Method order trades truncation
# error against per-step cost, while linear-setup frequency tests reuse of the
# existing linear system against convergence degradation. Tolerances and the
# solver structure remain fixed. Results are workload- and machine-specific.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ark-heat1d-yaml

executable:
  command: $builddir/examples/arkode/C_serial/ark_heat1D
  args: []
  cwd: .
  env: {}

parameters:
  - name: arkode.order
    type: int
    bounds: [2, 5]
  - name: arkode.lsetup_frequency
    type: int
    bounds: [5, 40]

objective:
  metric: wall_time
  direction: minimize
