# Tune dominant-eigenvalue handling for the internal-estimator LSRKStep stack.
# Update frequency balances estimator overhead against stale spectral data;
# the safety factor balances stability margin against the number of STS stages.
# Results are workload-, build-, and machine-specific.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ark-brusselator-lsrk-domeigest-yaml-default-surrogate

executable:
  command: $builddir/examples/arkode/C_serial/ark_brusselator_lsrk_domeigest
  args: []
  cwd: .
  env: {}

parameters:
  - name: arkode.dom_eig_frequency
    type: int
    bounds: [10, 50]
  - name: arkode.dom_eig_safety_factor
    type: float
    bounds: [1.0, 1.2]

objective:
  metric: wall_time
  direction: minimize
