# Tune the Robertson DIRK stack. Order explores accuracy and stage cost, while
# linear-setup and Jacobian frequencies trade reuse against nonlinear
# convergence. Tolerances and the dense Newton stack remain fixed.
# Results are workload-, build-, and machine-specific.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ark-robertson-yaml

executable:
  command: $builddir/examples/arkode/C_serial/ark_robertson
  args: []
  cwd: .
  env: {}

parameters:
  - name: arkode.order
    type: int
    bounds: [2, 5]
  - name: arkode.lsetup_frequency
    type: int
    bounds: [5, 40]
  - name: arkode.jac_eval_frequency
    type: int
    bounds: [20, 100]

objective:
  metric: wall_time
  direction: minimize
