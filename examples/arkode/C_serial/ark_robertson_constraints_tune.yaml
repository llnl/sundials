# Tune the constrained Robertson DIRK stack. Order explores accuracy and stage
# cost, while setup and Jacobian frequencies trade reuse against nonlinear
# convergence. Constraints, tolerances, and the dense Newton stack stay fixed.
# Results are workload-, build-, and machine-specific.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ark-robertson-constraints-yaml-default-surrogate

executable:
  command: $builddir/examples/arkode/C_serial/ark_robertson_constraints
  args: []
  cwd: .
  env: {}

parameters:
  - name: arkode.order
    type: int
    bounds: [2, 5]
  - name: arkode.lsetup_frequency
    type: int
    bounds: [5, 40]
  - name: arkode.jac_eval_frequency
    type: int
    bounds: [20, 100]

objective:
  metric: wall_time
  direction: minimize
