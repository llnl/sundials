# Tune the projected particle problem's BDF order and dense-system reuse.
# Order changes the accuracy/work balance; setup and Jacobian frequencies test
# reuse against nonlinear convergence. Projection, tolerances, and the dense
# Newton stack remain fixed. Results are workload- and machine-specific.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-cvodes-particle-yaml

executable:
  command: $builddir/examples/cvodes/serial/cvsParticle_dns
  args: []
  cwd: .
  env: {}

parameters:
  - name: cvodes.max_order
    type: int
    bounds: [2, 5]
  - name: cvodes.lsetup_frequency
    type: int
    bounds: [5, 40]
  - name: cvodes.jac_eval_frequency
    type: int
    bounds: [20, 100]

objective:
  metric: wall_time
  direction: minimize
