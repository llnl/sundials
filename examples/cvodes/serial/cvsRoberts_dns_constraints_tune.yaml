# Tune constrained Robertson BDF order and dense linear-system reuse.
# Order explores stability/accuracy versus work; setup and Jacobian frequencies
# trade reuse against nonlinear convergence. Positivity constraints, tolerances,
# and the solver stack stay fixed. Results are workload- and machine-specific.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-cvodes-roberts-constraints-yaml

executable:
  command: $builddir/examples/cvodes/serial/cvsRoberts_dns_constraints
  args: []
  cwd: .
  env: {}

parameters:
  - name: cvodes.max_order
    type: int
    bounds: [2, 5]
  - name: cvodes.lsetup_frequency
    type: int
    bounds: [5, 40]
  - name: cvodes.jac_eval_frequency
    type: int
    bounds: [20, 100]

objective:
  metric: wall_time
  direction: minimize
