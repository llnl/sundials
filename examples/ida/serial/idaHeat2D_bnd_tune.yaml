# Tune the heat DAE's BDF and nonlinear/setup controls. Order trades accuracy
# against work; delta_cj governs matrix setup reuse; the nonlinear coefficient
# balances solve tightness against iterations. The banded stack, constraints,
# tolerances, and consistent-IC procedure remain fixed.

backend:
  name: deephyper

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ida-heat2d-bnd-yaml-default-surrogate

executable:
  command: $builddir/examples/ida/serial/idaHeat2D_bnd
  args: []
  cwd: .
  env: {}

parameters:
  - name: ida.max_order
    type: int
    bounds: [2, 5]
  - name: ida.delta_cj_lsetup
    type: float
    bounds: [0.1, 0.5]
  - name: ida.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]

objective:
  metric: wall_time
  direction: minimize
