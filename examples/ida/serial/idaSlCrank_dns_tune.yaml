# Tune the slider-crank DAE's BDF and nonlinear/setup controls. Order trades
# accuracy against work; delta_cj controls linear-setup reuse; the nonlinear
# coefficient balances convergence strictness against iterations. The dense
# solver, algebraic-variable handling, and tolerances remain fixed.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-ida-slcrank-yaml

executable:
  command: $builddir/examples/ida/serial/idaSlCrank_dns
  args: []
  cwd: .
  env: {}

parameters:
  - name: ida.max_order
    type: int
    bounds: [2, 5]
  - name: ida.delta_cj_lsetup
    type: float
    bounds: [0.1, 0.5]
  - name: ida.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]

objective:
  metric: wall_time
  direction: minimize
