# Tune BDF order and dense linear-system reuse for the stiff KPR problem.
# Order explores stability/accuracy versus work; setup and Jacobian frequencies
# trade reuse against nonlinear convergence. The solver stack and tolerances
# remain fixed. Results are workload-, build-, and machine-specific.

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 5
  output_dir: /tmp/suntools-tune-cvode-kpr-yaml

executable:
  command: $builddir/examples/cvode/CXX_serial/cv_kpr
  args: []
  cwd: .
  env: {}

parameters:
  - name: cvode.max_order
    type: int
    bounds: [2, 5]
  - name: cvode.lsetup_frequency
    type: int
    bounds: [5, 40]
  - name: cvode.jac_eval_frequency
    type: int
    bounds: [20, 100]

objective:
  metric: wall_time
  direction: minimize
