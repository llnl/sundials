# Tune the BDF integration controls for cvAnalytic_mels.
#
# Why these parameters:
# - BDF orders 2 through 5 compare the A-stable order range with CVODE's
#   higher-order formulas without changing the example's solver structure.
# - The nonlinear convergence coefficient controls how tightly each implicit
#   step is solved; the logarithmic range brackets the CVODE default of 0.1.
# - This matrix-embedded linear solver needs no Jacobian or linear setup, so
#   setup-frequency parameters are intentionally omitted.
# The example checks the final solution against atan(t) and exits nonzero when
# its tolerance-scaled error exceeds one. This process-level check rejects
# inaccurate trials. Results are specific to this problem, build, and machine.
#
# Run from this directory:
#   suntools tune --config cvAnalytic_mels_tune.yaml

backend:
  name: deephyper
  options:
    surrogate_model: DUMMY

search:
  max_evals: 16
  workers: 1
  repetitions: 1
  output_dir: /tmp/suntools-tune-cvode-analytic-mels-yaml

executable:
  command: $builddir/examples/cvode/serial/cvAnalytic_mels
  args: []
  cwd: .
  env: {}

parameters:
  - name: cvode.max_order
    type: int
    bounds: [2, 5]
  - name: cvode.nonlin_conv_coef
    type: float
    bounds: [0.03, 0.3]
    scale: log

objective:
  metric: rhs_evals
  direction: minimize
  source: stdout
  regex: 'Total RHS evals = ([0-9]+)'
